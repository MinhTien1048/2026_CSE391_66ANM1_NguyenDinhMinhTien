<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đặt hàng</title>

<style>

body{
font-family:Arial;
padding:30px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
}

input,select,textarea{
padding:6px;
width:250px;
}

textarea{
height:80px;
}

.error{
color:red;
font-size:13px;
}

.counter{
font-size:12px;
color:gray;
}

.total{
font-weight:bold;
margin-top:10px;
}

.confirm-box{
border:1px solid #ccc;
padding:15px;
margin-top:20px;
display:none;
}

.success{
color:green;
font-size:20px;
font-weight:bold;
}

</style>

</head>

<body>

<h2>Đặt hàng</h2>

<form id="orderForm">

<div class="form-group">
<label>Sản phẩm</label>
<select id="product">
<option value="">-- Chọn sản phẩm --</option>
<option value="Ao">Áo</option>
<option value="Quan">Quần</option>
<option value="Giay">Giày</option>
</select>
<div class="error" id="productError"></div>
</div>

<div class="form-group">
<label>Số lượng</label>
<input type="number" id="quantity">
<div class="error" id="quantityError"></div>
</div>

<div class="form-group">
<label>Ngày giao hàng</label>
<input type="date" id="delivery">
<div class="error" id="deliveryError"></div>
</div>

<div class="form-group">
<label>Địa chỉ giao</label>
<input type="text" id="address">
<div class="error" id="addressError"></div>
</div>

<div class="form-group">
<label>Ghi chú</label>
<textarea id="note"></textarea>
<div class="counter" id="noteCounter">0/200</div>
<div class="error" id="noteError"></div>
</div>

<div class="form-group">
<label>Thanh toán</label>
<input type="radio" name="pay" value="COD"> COD
<input type="radio" name="pay" value="Bank"> Chuyển khoản
<input type="radio" name="pay" value="Wallet"> Ví điện tử
<div class="error" id="payError"></div>
</div>

<div class="total">
Tổng tiền: <span id="totalPrice">0</span> VND
</div>

<br>
<button type="submit">Đặt hàng</button>

</form>


<div class="confirm-box" id="confirmBox">
<h3>Xác nhận đơn hàng</h3>
<p id="orderSummary"></p>
<button id="confirmBtn">Xác nhận</button>
<button id="cancelBtn">Hủy</button>
</div>

<div class="success" id="successMsg"></div>

<script src="script.js"></script>

</body>
</html>
